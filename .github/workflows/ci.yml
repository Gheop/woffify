name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.4', 'stable']   # exercise the go.mod minimum and the latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install C dependencies
        env:
          WOFF2_TAG: v1.0.2
          WOFF2_SHA: 1bccf208bca986e53a647dfe4811322adb06ecf8
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libbrotli-dev pkg-config g++
          # Ubuntu has no woff2 -dev package; build the encoder from a pinned source.
          git clone --depth 1 --branch "$WOFF2_TAG" https://github.com/google/woff2 /tmp/woff2
          test "$(git -C /tmp/woff2 rev-parse HEAD)" = "$WOFF2_SHA"
          cd /tmp/woff2
          g++ -O2 -std=c++11 -include cstdint -fPIC -Iinclude -c \
            src/woff2_enc.cc src/font.cc src/glyph.cc src/normalize.cc \
            src/transform.cc src/table_tags.cc src/variable_length.cc \
            src/woff2_common.cc src/woff2_out.cc
          sudo ar rcs /usr/lib/libwoff2enc.a *.o
          sudo cp -r include/woff2 /usr/include/
          printf 'Name: woff2enc\nDescription: woff2 encoder\nVersion: 1.0.2\nLibs: -lwoff2enc -lbrotlienc -lbrotlicommon\nCflags:\n' \
            | sudo tee /usr/lib/pkgconfig/libwoff2enc.pc > /dev/null
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o woffify .
