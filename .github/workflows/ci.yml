name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ['1.26.4', 'stable']   # exercise the go.mod minimum and the latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install C dependencies
        env:
          WOFF2_TAG: v1.0.2
          WOFF2_SHA: 1bccf208bca986e53a647dfe4811322adb06ecf8
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libbrotli-dev pkg-config g++
          # Ubuntu has no woff2 -dev package; build the encoder from a pinned source.
          git clone --depth 1 --branch "$WOFF2_TAG" https://github.com/google/woff2 /tmp/woff2
          test "$(git -C /tmp/woff2 rev-parse HEAD)" = "$WOFF2_SHA"
          cd /tmp/woff2
          g++ -O2 -std=c++11 -include cstdint -fPIC -Iinclude -c \
            src/woff2_enc.cc src/font.cc src/glyph.cc src/normalize.cc \
            src/transform.cc src/table_tags.cc src/variable_length.cc \
            src/woff2_common.cc src/woff2_out.cc
          sudo ar rcs /usr/lib/libwoff2enc.a *.o
          sudo cp -r include/woff2 /usr/include/
          printf 'Name: woff2enc\nDescription: woff2 encoder\nVersion: 1.0.2\nLibs: -lwoff2enc -lbrotlienc -lbrotlicommon\nCflags:\n' \
            | sudo tee /usr/lib/pkgconfig/libwoff2enc.pc > /dev/null
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o woffify .

  # Publish only what passed the tests. Pull requests build the image without
  # pushing it, so a broken Dockerfile shows up before the merge.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gheop/woffify
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
